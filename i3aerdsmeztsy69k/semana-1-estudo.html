<!doctype html><html lang="pt-BR"><head>
<meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concílio · Semana 1</title><style>
:root{--accent:#5b9cff;--bad:#ff6b7a;--bg:#0f1218;--border:#2e3850;--card:#1a2030;--good:#3ecf8e;--muted:#9aa8c0;--tap:#2a6df5;--tap-done:#1f8a5a;--text:#e8eef8;--warn:#f5c542}
body{background:var(--bg);color:var(--text);font:17px/1.5 system-ui,sans-serif;margin:0;padding:14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
h1{font-size:20px}h2{font-size:18px;color:var(--accent)}.hint{color:var(--muted);font-size:14px}
button{background:var(--tap);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin:4px}
button.done{background:var(--tap-done)}textarea{width:100%;box-sizing:border-box;background:#0b0e14;color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:16px;padding:8px}
.ok{color:var(--good)}.bad{color:var(--bad)}.miss{color:var(--warn)}.nav button{min-width:44px}.nav .cur{outline:2px solid var(--warn)}
.v{border-left:3px solid var(--accent);padding-left:8px;margin:6px 0}.reps span{display:inline-block;width:26px;height:26px;border-radius:50%;border:2px solid var(--border);margin:2px}.reps span.on{background:var(--good);border-color:var(--good)}
.pct{font-size:22px;font-weight:700}
</style></head><body>
<h1>Concílio de ordenação · Semana 1 <span class="hint">(24/10–30/10/2026)</span></h1>
<div class="hint">Uma pergunta por vez: leia → ouça/cante 7× → esconda e escreva de memória (meta 90%).</div>
<div class="nav card" id="nav"></div><div id="main"></div>
<script>
const AUDIO={"0.1":[["1. A pergunta","audio-estudo/s1-q0.1-b1.mp3"],["2. Resposta, parte 1 (cresci na igreja… estudar a Palavra)","audio-estudo/s1-q0.1-b2.mp3"],["3. Resposta, parte 2 (o Senhor abriu meu coração… nova conversão)","audio-estudo/s1-q0.1-b3.mp3"],["4. Atos 16.14","audio-estudo/s1-q0.1-b4.mp3"],["5. Efésios 2.1","audio-estudo/s1-q0.1-b5.mp3"],["6. Efésios 2.8–9","audio-estudo/s1-q0.1-b6.mp3"]]};const PLAYERS={};function montaAudio(){document.querySelectorAll('.slotaudio').forEach(sl=>{const id=sl.dataset.id;if(!PLAYERS[id]){const w=document.createElement('div');AUDIO[id].forEach(([nome,src])=>{const bx=document.createElement('div');bx.style.margin='10px 0';bx.innerHTML='<div><b></b></div><audio controls loop preload="metadata" playsinline style="width:100%;margin:4px 0"></audio><div class="hint">Toca 7 vezes e para sozinho.</div>';bx.querySelector('b').textContent=nome;const a=bx.querySelector('audio'),lb=bx.lastChild;a.src=src;let n=0,last=0;const show=()=>{lb.textContent='Tocando '+n+'/7'};a.addEventListener('play',()=>{w.querySelectorAll('audio').forEach(o=>{if(o!==a)o.pause()});if(n===0||n>7){n=1;a.loop=true;a.currentTime=0;show();}});a.addEventListener('timeupdate',()=>{const t=a.currentTime;if(a.loop&&last>a.duration-2&&t<1.5){n++;if(n>=7)a.loop=false;show();}last=t;});a.addEventListener('ended',()=>{n=8;lb.textContent='Pronto: 7 de 7. Aperte play para recomeçar.';});w.appendChild(bx);});PLAYERS[id]=w;}sl.appendChild(PLAYERS[id]);});}
function tocou7(a){let n=+(a.dataset.n||1);if(n<7){n++;a.dataset.n=n;a.nextElementSibling.textContent="Tocando "+n+"/7";a.currentTime=0;a.play();}else{a.dataset.n="";a.nextElementSibling.textContent="Pronto: 7 de 7 reproduções. Aperte play para recomeçar.";}}const Q=[{"id": "0.1", "titulo": "Testemunho de conversão", "versos": ["At 16:14 — “Certa mulher, chamada Lídia, da cidade de Tiatira, vendedora de púrpura, temente a Deus, nos escutava; o Senhor lhe abriu o coração para atender às coisas que Paulo dizia.”", "Ef 2:1 — “Ele vos deu vida, estando vós mortos nos vossos delitos e pecados,”", "Ef 2:8–9 — “Porque pela graça sois salvos, mediante a fé; e isto não vem de vós; é dom de Deus; não de obras, para que ninguém se glorie.”"], "pergunta": "Conte-nos como você se converteu.", "resposta": "Eu cresci na igreja, me afastei por volta dos doze anos e voltei aos dezoito, depois de um acampamento, mas ainda sem compreender o evangelho. Servi por um tempo por motivos errados e saí da igreja. Quando voltei, abri minhas dúvidas com amigos que me ajudaram a estudar a Palavra, e ali o Senhor abriu o meu coração, como fez com Lídia (At 16:14), para confiar somente em Cristo. Eu estava morto nos meus delitos, e Deus me deu vida (Ef 2:1). Fui batizado na Igreja Batista Nacional Bereana, pelo Pr. Luiz Gonzaga, por volta de 2013, com cerca de 19 anos, já como crente [a confirmar: data da aprovação do batismo]. Depois disso, o que cresceu foi a firmeza, não uma nova conversão. Tudo isso é graça: “pela graça sois salvos, mediante a fé” (Ef 2:8–9).", "cuidado": "fale da saída da Bereana com graça, sem criticar a igreja; a data exata da aprovação do batismo ainda está [a confirmar]."}, {"id": "0.2", "titulo": "Chamado ao ministério", "versos": ["1Tm 3:1 — “Fiel é a palavra: se alguém aspira ao episcopado, excelente obra almeja.”", "At 13:2–3 — “E, servindo eles ao Senhor e jejuando, disse o Espírito Santo: Separai-me, agora, Barnabé e Saulo para a obra a que os tenho chamado. Então, jejuando, e orando, e impondo sobre eles as mãos, os despediram.”"], "pergunta": "Como você percebeu o seu chamado e como a igreja o confirmou?", "resposta": "Entendo o chamado como um desejo santo pela obra, confirmado pela igreja. Paulo diz: “se alguém aspira ao episcopado, excelente obra almeja” (1Tm 3:1). Esse desejo ficou claro quando cuidei de uma congregação por aproximadamente dois anos: preparar sermões toda semana, cuidar e discipular pessoas. A igreja foi confirmando esse desejo, como a igreja de Antioquia, que impôs as mãos e enviou Barnabé e Saulo (At 13:2–3): a Igreja Batista Morada Nova me enviou como missionário, me confiou a congregação, me enviou ao CEBESP e agora o Pr. Natan me colocou como estagiário numa igreja irmã. A igreja aprovou este concílio em assembleia [a confirmar: data]. Se o concílio disser “ainda não”, eu receberia com humildade.", "cuidado": "não fale como se a ordenação fosse um direito; ela reconhece um chamado que a igreja já viu."}, {"id": "0.3", "titulo": "Vida devocional", "versos": ["Sl 119:11 — “Guardo no coração as tuas palavras, para não pecar contra ti.”", "1Tm 4:16 — “Tem cuidado de ti mesmo e da doutrina. Continua nestes deveres; porque, fazendo assim, salvarás tanto a ti mesmo como aos teus ouvintes.”"], "pergunta": "Como é a sua vida devocional?", "resposta": "A minha vida devocional tem a Palavra no centro: leitura bíblica, memorização e oração. Memorizei o livro de Jonas e aprendi o valor de esconder a Palavra no coração: “Guardo no coração as tuas palavras, para não pecar contra ti” (Sl 119:11). Oro pela minha família, pela igreja e pelos campos missionários. Em casa, todos os dias às nove da manhã, fazemos o culto doméstico com a Débora e as crianças: um hino, uma leitura, uma pergunta do catecismo, normalmente o Catecismo Batista de Keach, de 1693, e oração. Tenho lutas como qualquer crente, mas sei que o pastor precisa cuidar de si mesmo e da doutrina (1Tm 4:16).", "cuidado": "não exagere a rotina; fale do que é real."}, {"id": "0.4", "titulo": "Família: casamento, filhos e o lar como primeiro ministério", "versos": ["1Tm 3:4–5 — “e que governe bem a própria casa, criando os filhos sob disciplina, com todo o respeito (pois, se alguém não sabe governar a própria casa, como cuidará da igreja de Deus?);”", "Ef 5:25 — “Maridos, amai vossa mulher, como também Cristo amou a igreja e a si mesmo se entregou por ela,”", "Ef 6:4 — “E vós, pais, não provoqueis vossos filhos à ira, mas criai-os na disciplina e na admoestação do Senhor.”"], "pergunta": "Como está a sua família e como ela vê o seu chamado?", "resposta": "Sou casado com a Débora, que me apoia e confirma este chamado. O Senhor nos deu cinco filhos. A Bethany, de oito anos, é a mais velha; o segundo já está com o Senhor; depois vieram a Anya, de três, o Yosef, de dois, e o Yohan, recém-nascido. Entendo que a minha casa é o meu primeiro ministério: o pastor precisa governar bem a própria casa, “pois, se alguém não sabe governar a própria casa, como cuidará da igreja de Deus?” (1Tm 3:4–5). Quero amar a Débora como Cristo amou a igreja (Ef 5:25) e criar os filhos “na disciplina e na admoestação do Senhor” (Ef 6:4). Por isso fazemos o culto doméstico, simples e constante. Agora a família toda serve comigo na igreja irmã.", "cuidado": "não apresente a família como perfeita; mostre cuidado, constância e prioridade."}, {"id": "0.5", "titulo": "Pureza sexual e integridade moral", "versos": ["1Co 6:18 — “Fugi da impureza. Qualquer outro pecado que uma pessoa cometer é fora do corpo; mas aquele que pratica a imoralidade peca contra o próprio corpo.”", "2Tm 2:22 — “Foge, outrossim, das paixões da mocidade. Segue a justiça, a fé, o amor e a paz com os que, de coração puro, invocam o Senhor.”", "Gn 39:12 — “Então, ela o pegou pelas vestes e lhe disse: Deita-te comigo; ele, porém, deixando as vestes nas mãos dela, saiu, fugindo para fora.”"], "pergunta": "Como você se protege na área sexual e moral?", "resposta": "Eu me protejo, primeiro, guardando o coração e fugindo da imoralidade: “Fugi da impureza” (1Co 6:18) e “foge... das paixões da mocidade” (2Tm 2:22). Cultivo o meu casamento com a Débora e presto contas a irmãos de confiança. Na prática: não aconselho mulheres a sós em lugar fechado, prefiro a presença da minha esposa ou de outra irmã, cuido das mensagens e redes sociais, tenho filtros e transparência no celular e evito viagens e caronas a sós. José fugiu (Gn 39:12). Não confio na minha força; dependo da graça e das proteções que a igreja pode ver.", "cuidado": "não diga “isso nunca vai acontecer comigo”; mostre dependência de Deus e prestação de contas."}];const KEY="concilio-sem-1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{i:0,reps:{},best:{},txt:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function normalize(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[\u201c\u201d"']/g,"").replace(/[.,;:!?()[\]{}—–\-…]/g," ").replace(/\s+/g," ").trim()}
function words(s){return normalize(s).split(" ").filter(Boolean)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function compareWords(expected, actual){
  const e=words(expected), a=words(actual), n=e.length, m=a.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]= e[i]===a[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,html="",correct=0;
  while(i<n||j<m){
    if(i<n&&j<m&&e[i]===a[j]){ html+=`<span class="ok">${escapeHtml(a[j])}</span> `; correct++; i++; j++; }
    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){ html+=`<span class="miss">${escapeHtml(a[j])}</span> `; j++; }
    else { html+=`<span class="bad" style="text-decoration:line-through">${escapeHtml(e[i])}</span> `; i++; }
  }
  const pct=n?Math.round(correct/n*100):0;
  html+=`<div class="hint" style="margin-top:6px"><span class="ok">verde</span> = certa · <span class="bad" style="text-decoration:line-through">riscada</span> = faltou · <span class="miss">amarela</span> = a mais</div>`;
  return {html, pct, correct, total:n};
}
// texto-alvo da caixinha: resposta sem marcadores [Abner completa...]
function alvo(q){return q.resposta.replace(/\[(?:Abner completa|a confirmar)[^\]]*\]\.?/g,"")}
function render(){
  document.getElementById("nav").innerHTML=Q.map((q,k)=>`<button class="${k==S.i?'cur':''} ${(S.best[q.id]||0)>=90?'done':''}" onclick="S.i=${k};save();render()">${q.id}</button>`).join("");
  const q=Q[S.i],r=S.reps[q.id]||0,b=S.best[q.id]||0;
  document.getElementById("main").innerHTML=`
  <div class="card"><h2>${q.id} · ${escapeHtml(q.titulo)}</h2><b>Pergunta provável:</b> ${escapeHtml(q.pergunta)}</div>
  <div class="card" id="resp"><b>Resposta-modelo (até 1 min)</b><p>${escapeHtml(q.resposta).replace(/\[(?:Abner completa|a confirmar)[^\]]*\]/g,m=>`<span class="miss">${m}</span>`)}</p>
   <div class="hint"><b>Cuidado:</b> ${escapeHtml(q.cuidado||"")}</div></div>
  <div class="card"><b>Textos bíblicos (ARA)</b>${q.versos.map(v=>`<div class="v">${escapeHtml(v)}</div>`).join("")}</div>
  <div class="card"><b>Música — 7 repetições</b> <span class="hint">${AUDIO[q.id]?"(ouça bloco por bloco: “Como Você Se Converteu”)":"(cante a estrofe "+q.id+" da letra da semana)"}</span>
   ${AUDIO[q.id]?`<div class="slotaudio" data-id="${q.id}"></div>`:""}
   <div class="reps">${[...Array(7)].map((_,k)=>`<span class="${k<r?'on':''}"></span>`).join("")}</div>
   <button onclick="rep(1)">+1 repetição (${r}/7)</button><button onclick="rep(-1)" style="background:#444">−1</button></div>
  <div class="card"><b>Caixinha de escrita</b> <span class="hint">— esconda a resposta e escreva de memória. Meta: 90%. Melhor: ${b}%</span>
   <button onclick="document.getElementById('resp').style.display=document.getElementById('resp').style.display=='none'?'':'none'" style="background:#444">Esconder/mostrar resposta</button>
   <textarea id="t" rows="9" oninput="S.txt['${q.id}']=this.value;save()">${escapeHtml(S.txt[q.id]||"")}</textarea>
   <button onclick="check()">Conferir</button><div id="res"></div></div>
  <div class="card">${S.i<Q.length-1?`<button onclick="S.i++;save();render()">Próxima pergunta →</button>`:'<b>Fim da semana.</b>'}</div>`;
}
function rep(d){const id=Q[S.i].id;S.reps[id]=Math.max(0,Math.min(7,(S.reps[id]||0)+d));save();render()}
function check(){const q=Q[S.i];const r=compareWords(alvo(q),document.getElementById("t").value);
 S.best[q.id]=Math.max(S.best[q.id]||0,r.pct);save();render();
 document.getElementById("resp").style.display="none";
 document.getElementById("res").innerHTML=`<div class="pct ${r.pct>=90?'ok':'bad'}">${r.pct}% ${r.pct>=90?'✓ meta atingida':'— meta 90%'}</div><div>${r.html}</div>`;}
const _render0=render;render=function(){const tocando=Object.values(PLAYERS).flatMap(w=>[...w.querySelectorAll('audio')]).filter(a=>!a.paused);_render0();montaAudio();tocando.forEach(a=>{if(document.body.contains(a))a.play().catch(()=>{})});};
render();
</script></body></html>
