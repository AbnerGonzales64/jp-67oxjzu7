function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function todayDayId(){
  const d=new Date();
  const map={1:"seg",2:"ter",3:"qua",4:"qui",5:"sex",6:"sab"};
  return map[d.getDay()]||"seg";
}

function defaultDay(){return{step:0,checks:{},reps:{catecismo:0,verse:0}}}
function defaultState(){
  const days={}; for(const d of DAYS) days[d.id]=defaultDay();
  return {day:todayDayId(), days};
}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")||{}}catch(e){return{}}}
let state=Object.assign(defaultState(), load());
if(!state.days) state.days=defaultState().days;
for(const d of DAYS){
  if(!state.days[d.id]) state.days[d.id]=defaultDay();
  const dd=state.days[d.id];
  if(!dd.reps) dd.reps={catecismo:0,verse:0};
  if(!dd.checks) dd.checks={};
}
if(!DAYS.find(d=>d.id===state.day)) state.day=todayDayId();
function save(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state))}

function cur(){return state.days[state.day]}
function dayInfo(){return DAYS.find(d=>d.id===state.day)}

function setCheck(id,val){cur().checks[id]=!!val;save()}
function tapRep(key){const r=cur().reps; if((r[key]||0)<7){r[key]=(r[key]||0)+1;save();render()}}
function resetRep(key){cur().reps[key]=0;save();render()}

function counterUI(key,label){
  const n=cur().reps[key]||0, done=n>=7;
  let dots=""; for(let i=0;i<7;i++) dots+=`<span class="dot ${i<n?"on":""}"></span>`;
  return `<div class="counter-wrap"><div class="dots">${dots}</div>
    <button type="button" class="counter-btn ${done?"done":""}" onclick="tapRep('${key}')">
      <span class="counter-num">${n}/7</span>${done?"✓ Completo":label}
    </button>
    ${n?`<p class="hint"><a href="#" onclick="resetRep('${key}');return false" style="color:var(--muted)">Zerar contador</a></p>`:""}
  </div>`;
}
function checkRow(id,label){
  const on=!!cur().checks[id];
  return `<label class="check ${on?"done":""}"><input type="checkbox" ${on?"checked":""} onchange="setCheck('${id}',this.checked);render()"><span>${label}</span></label>`;
}

function dayDone(id){
  const dd=state.days[id]; if(!dd) return false;
  return !!(dd.checks&&dd.checks.day_done);
}

function selectDay(id){
  if(!DAYS.find(d=>d.id===id)) return;
  state.day=id; save(); renderDays(); render(); window.scrollTo(0,0);
}

function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML=DAYS.map(d=>`<button type="button" class="day-btn ${d.id===state.day?"active":""} ${dayDone(d.id)?"done-day":""}" onclick="selectDay('${d.id}')"><strong>${d.label}</strong>${d.date}</button>`).join("");
}


function milestoneCard(){
  const today=new Date(); today.setHours(0,0,0,0);
  const day=dayInfo();
  // map day id to calendar date this week
  const weekDates={seg:"2026-11-09",ter:"2026-11-10",qua:"2026-11-11",qui:"2026-11-12",sex:"2026-11-13",sab:"2026-11-14"};
  const todayKey=weekDates[day.id]||"";
  const todayMs=MILESTONES.filter(m=>m.date===todayKey);
  const upcoming=MILESTONES.filter(m=>m.date>=todayKey).slice(0,3);
  let list=upcoming.map(m=>{
    const isToday=m.date===todayKey;
    return `<li${isToday?` style="color:var(--warn);font-weight:700"`:""}>${escapeHtml(m.label)} — ${escapeHtml(m.title)}${isToday?" · hoje!":""}</li>`;
  }).join("");
  if(!list) list=MILESTONES.slice(-3).map(m=>`<li>${escapeHtml(m.label)} — ${escapeHtml(m.title)}</li>`).join("");
  const todayNote=todayMs.length?`<p class="chant" style="font-size:1.05rem;color:var(--warn)">🎉 Marco de hoje: ${escapeHtml(todayMs[0].title)}</p>`:"";
  return `<div class="card"><h3>Marcos de celebração</h3>
    ${todayNote}
    <ul class="list-plain">${list}</ul>
    <p class="hint">${escapeHtml(MILESTONE_SEND)}</p>
  </div>`;
}

(function(){

const RV={}; /* sessão atual por chave: {i:palavras reveladas, m:[1 ok,0 erro,null], full:bool} */
function rvText(key){let l=String(REP_LYRICS(key)||"").split("\n\nAnya")[0]; const a=l.split("\n");
  let head=""; if(HDR_KEYS[key]&&a.length>1){head=a.shift().trim();}
  const words=a.join(" ").replace(/\s+/g," ").trim().split(" ").filter(Boolean); return {head,words};}
function rvS(key){const t=rvText(key); let r=RV[key]; if(!r||r.n!==t.words.length) r=RV[key]={i:0,m:[],full:false,n:t.words.length}; return [r,t];}
function rvLog(key){const s=_rm(); if(!s.revLog) s.revLog={}; if(!s.revLog[key]) s.revLog[key]=[]; return s.revLog[key];}
window.rvReveal=function(key){const [r,t]=rvS(key); if(r.i<t.words.length){r.i++; render();}};
window.rvMark=function(key,idx,ok){const [r]=rvS(key); r.m[idx]=ok; render();};
window.rvFull=function(key){const [r]=rvS(key); r.full=true; render();};

  delete RV[key]; tapRepLevel(key,lvl);};
function rvStats(key){const [r,t]=rvS(key); const ok=r.m.filter(x=>x===1).length; const marked=r.m.filter(x=>x===1||x===0).length; return {r,t,ok,marked};}
function lvlLabel(l){return l==="cabeca"?"de cabeça":"lendo/ouvindo";}
window.repModeText=function(key){const m=(_rm().repLevels[key])||{}; return "de cabeça "+((m.cabeca||0)+(m.memoria||0))+" · lendo/ouvindo "+((m.lendo||0)+(m.musica||0)+(m.letra||0));};
const BTN='display:block;width:100%;min-height:64px;margin:8px 0;font-size:1.2rem;border-radius:16px;';

  if(done) return `<div class="counter-wrap"><div class="dots">${dots}</div><p style="font-size:1.4rem;margin:6px 0"><strong>7/7</strong> ✓ Completo</p>${logHtml}<p class="hint">${repModeText(key)} · <a href="#" onclick="resetRep('${key}');return false" style="color:var(--muted)">Zerar</a></p></div>`;
  const {r,t,ok,marked}=rvStats(key); const tot=t.words.length, fin=r.i>=tot;
  let shown=""; for(let i=0;i<r.i;i++){const mk=r.m[i];
    shown+=`<span style="display:inline-block;margin:3px 2px;padding:4px 6px;border-radius:8px;background:${mk===1?"#1a7a4c":mk===0?"#8a2b2b":"#2a3140"}"><span style="font-size:1.15rem">${escapeHtml(t.words[i])}</span><br><button type="button" style="min-width:40px;min-height:40px;margin:2px;background:${mk===1?"#2bb673":"#3a4254"}" onclick="rvMark('${key}',${i},1)" aria-label="Acertei">✓</button><button type="button" style="min-width:40px;min-height:40px;margin:2px;background:${mk===0?"#d9534f":"#3a4254"}" onclick="rvMark('${key}',${i},0)" aria-label="Errei">✗</button></span>`;}

    </div>

  </div>`;
};
