<!doctype html><html lang=pt-BR><head>
<meta name="robots" content="noindex"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Fiel em Toda Boa Obra – partes</title><style>body{font-family:sans-serif;max-width:640px;margin:auto;padding:16px;background:#faf7f0}.c{background:#fff;border-radius:12px;padding:12px;margin:12px 0;box-shadow:0 1px 4px #0002}audio{width:100%}button{font-size:18px;padding:8px 14px;margin-top:6px;border-radius:8px}h2{font-size:19px}small{color:#777}.ct{font-size:18px;font-weight:bold;margin-top:6px}</style></head><body><h1>🎵 Fiel em Toda Boa Obra</h1><p>Dê play numa parte: ela repete sozinha e para.</p><p><label>Repetir cada parte <input id=nrep type=number min=1 max=99 value=7 style="width:60px;font-size:18px"> vezes</label></p><div class=c><h2>CFB 1.1 <small>sua gravação</small></h2><audio controls class=p preload="none" src="audio-voz/01-cfb-1-1.mp3"></audio><div class=ct>0/7</div></div><div class=c><h2>2Tm 3.16-17 <small>sua gravação</small></h2><audio controls class=p preload="none" src="audio-voz/02-2tm-3-16-17.mp3"></audio><div class=ct>0/7</div></div><div class=c><h2>Inglês <small>sua gravação</small></h2><audio controls class=p preload="none" src="audio-voz/03-ingles.mp3"></audio><div class=ct>0/7</div></div><div class=c><h2>Alfabeto grego <small>2:09–2:28</small></h2><audio controls class=p preload="none" src="audio-suno/grego.mp3"></audio><div class=ct>0/7</div></div><div class=c><h2>Finanças <small>sua gravação</small></h2><audio controls class=p preload="none" src="audio-voz/04-financas.mp3"></audio><div class=ct>0/7</div></div><div class=c><h2>Música completa</h2><audio controls preload="none" src="audio-suno/musica-semana.mp3"></audio></div><script>/*repN-v2*/var N=parseInt(localStorage.getItem('repN'))||7;if(N<1||N>99)N=7;var inp=document.getElementById('nrep');inp.value=N;
var all=[].slice.call(document.querySelectorAll('audio'));
function ct(a){return a.parentNode.querySelector('.ct')}
function upd(a){var c=ct(a);if(c)c.textContent=(a._done?N+'/'+N+' ✓':(a._r||0)+'/'+N)}
function save(){var v=parseInt(inp.value);if(v>0&&v<100){N=v;localStorage.setItem('repN',N);all.forEach(function(a){if(a._r&&!a._done)a.loop=a._r<N;upd(a)})}}
inp.addEventListener('change',save);inp.addEventListener('input',save);
all.forEach(function(a){if(a._repInit)return;a._repInit=true;var rep=a.classList.contains('p');a.loop=false;a._last=0;upd(a);
a.addEventListener('play',function(){all.forEach(function(o){if(o!==a&&!o.paused)o.pause()});if(rep){a._r=1;a._done=false;a._last=0;a.loop=N>1;upd(a)}});
a.addEventListener('timeupdate',function(){if(!rep||!a._r||a._done)return;var t=a.currentTime,d=a.duration||0;
if(d&&a._last>d-2&&t<1.5&&a._r<N){a._r++;a.loop=a._r<N;upd(a)}a._last=t});
a.addEventListener('ended',function(){if(!rep)return;a._done=true;a.loop=false;upd(a)})});</script></body></html>
